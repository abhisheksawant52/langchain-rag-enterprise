[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-rag-enterprise"
version = "0.1.0"
description = "Enterprise-grade Retrieval-Augmented Generation service built on LangChain and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = ["rag", "langchain", "llm", "fastapi", "retrieval-augmented-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langchain>=0.2",
  "langchain-community>=0.2",
  "langchain-openai>=0.1",
  "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.0",
  "pre-commit>=3.7",
  "httpx>=0.27",
]

[project.scripts]
langchain-rag = "langchain_rag.main:main"

[project.urls]
Homepage = "https://github.com/abhisheksawant52/langchain-rag-enterprise"
Repository = "https://github.com/abhisheksawant52/langchain-rag-enterprise"
Issues = "https://github.com/abhisheksawant52/langchain-rag-enterprise/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
